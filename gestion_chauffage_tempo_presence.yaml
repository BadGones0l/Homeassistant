blueprint:
  name: Gestion avancée du chauffage avec EDF Tempo, fenêtres, zones et modes (simplifié)
  description: >
    Contrôle des chauffages en fonction de la présence, des jours Tempo (EDF),
    des horaires et de l'état des fenêtres.
  domain: automation

  input:
    climate_entities:
      name: Thermostats
      description: Liste des entités des thermostats
      selector:
        target:
          entity:
            domain: climate

    presence_group:
      name: Groupe de présence
      default: group.all_person
      selector:
        entity:
          domain: group

    tempo_sensor:
      name: Capteur EDF Tempo
      default: sensor.rte_tempo_couleur_actuelle
      selector:
        entity:
          domain: sensor

    window_sensors:
      name: Capteurs de fenêtres
      selector:
        entity:
          domain: binary_sensor

    input_text_mode:
      name: Entité input_text pour afficher le mode actuel
      selector:
        entity:
          domain: input_text
    preset_presence:
      name: Mode thermostat en journée (présence)
      selector:
        select:
          options:
            - none
            - frost
            - eco
            - comfort
            - boost

    preset_wake:
      name: Mode thermostat au réveil
      selector:
        select:
          options:
            - none
            - frost
            - eco
            - comfort
            - boost

    preset_evening:
      name: Mode thermostat en soirée
      selector:
        select:
          options:
            - none
            - frost
            - eco
            - comfort
            - boost

    preset_night:
      name: Mode thermostat la nuit
      selector:
        select:
          options:
            - none
            - frost
            - eco
            - comfort
            - boost

    preset_absence:
      name: Mode thermostat en absence
      selector:
        select:
          options:
            - none
            - frost
            - eco
            - comfort
            - boost

    preset_red_day:
      name: Mode thermostat jour rouge
      selector:
        select:
          options:
            - none
            - frost
            - eco
            - comfort
            - boost

    time_wake:
      name: Réveil
      default: "06:15"
      selector:
        time:

    time_morning:
      name: Début journée
      default: "08:00"
      selector:
        time:

    time_evening:
      name: Début soirée
      default: "19:00"
      selector:
        time:

    time_night:
      name: Début nuit
      default: "23:00"
      selector:
        time:

trigger:
  - platform: state
    entity_id: !input presence_group
  - platform: state
    entity_id: !input tempo_sensor
  - platform: state
    entity_id: !input window_sensors
    to: "on"
  - platform: state
    entity_id: !input window_sensors
    to: "off"
  - platform: time
    at:
      - !input time_night
      - !input time_morning
      - !input time_evening
      - !input time_wake

action:
  - choose:
      # Fenêtres ouvertes
      - conditions:
          - condition: state
            entity_id: !input window_sensors
            match: any
            state: "on"
        sequence:
          - service: climate.turn_off
            target: !input climate_entities
          - service: input_text.set_value
            target:
              entity_id: !input input_text_mode
            data:
              value: "Chauffage désactivé : Fenêtres ouvertes"

      # Jour rouge
      - conditions:
          - condition: state
            entity_id: !input tempo_sensor
            state: "Rouge"
          - condition: state
            entity_id: !input window_sensors
            match: all
            state: "off"
        sequence:
          - service: climate.turn_on
            target: !input climate_entities
          - service: climate.set_preset_mode
            data:
              preset_mode: !input preset_red_day
            target: !input climate_entities
          - service: input_text.set_value
            target:
              entity_id: !input input_text_mode
            data:
              value: "Jour rouge"

            # Absence
      - conditions:
          - condition: state
            entity_id: !input presence_group
            state: "not_home"
          - condition: state
            entity_id: !input window_sensors
            match: all
            state: "off"
        sequence:
          - service: climate.turn_on
            target: !input climate_entities
          - service: climate.set_preset_mode
            data:
              preset_mode: !input preset_absence
            target: !input climate_entities
          - service: input_text.set_value
            target:
              entity_id: !input input_text_mode
            data:
              value: "Absence"

      # Présence à la maison

      - conditions:
          - condition: state
            entity_id: !input presence_group
            state: "home"
          - condition: state
            entity_id: !input window_sensors
            match: all
            state: "off"
        sequence:
          - service: climate.turn_on
            target: !input climate_entities
          - choose:
              - conditions:
                  - condition: time
                    after: !input time_wake
                    before: !input time_morning
                sequence:
                  - service: climate.set_preset_mode
                    data:
                      preset_mode: !input preset_wake
                    target: !input climate_entities
                  - service: input_text.set_value
                    target:
                      entity_id: !input input_text_mode
                    data:
                      value: "Réveil"
              - conditions:
                  - condition: time
                    after: !input time_morning
                    before: !input time_evening
                sequence:
                  - service: climate.set_preset_mode
                    data:
                      preset_mode: !input preset_presence
                    target: !input climate_entities
                  - service: input_text.set_value
                    target:
                      entity_id: !input input_text_mode
                    data:
                      value: "Journée"
              - conditions:
                  - condition: time
                    after: !input time_evening
                    before: !input time_night
                sequence:
                  - service: climate.set_preset_mode
                    data:
                      preset_mode: !input preset_evening
                    target: !input climate_entities
                  - service: input_text.set_value
                    target:
                      entity_id: !input input_text_mode
                    data:
                      value: "Soirée"
              - conditions:
                  - condition: time
                    after: !input time_night
                sequence:
                  - service: climate.set_preset_mode
                    data:
                      preset_mode: !input preset_night
                    target: !input climate_entities
                  - service: input_text.set_value
                    target:
                      entity_id: !input input_text_mode
                    data:
                      value: "Nuit"

mode: single
